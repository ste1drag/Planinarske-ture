services:
  mountaintoursgateway.api:
    image: ${DOCKER_REGISTRY-}moutaintoursgatewayapi
    build:
      context: ./MountainToursGateway
      dockerfile: MoutainToursGateway.API/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - ASPNETCORE_URLS=http://+:8084
      - ASPNETCORE_HTTP_PORTS=8084
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - gateway_keys:/home/app/.aspnet/DataProtection-Keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - tours-api
      - identity-api
      - reviewing-api
      - notifications-api

  tours-api:
    image: tours-api:latest
    build:
      context: .
      dockerfile: Services/Tours/Tours.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ToursDB=Server=tours_db;Initial Catalog=ToursDb;User Id=sa;Password=PlaninarskeTureToursDB*1;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    depends_on:
      - tours_db
      - rabbitmq

  identity-api:
    image: identity-api:latest
    build:
      context: .
      dockerfile: Services/Identity/Identity.API/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_URLS=http://+:8081
      - ASPNETCORE_HTTP_PORTS=8081
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDB=Server=identity_db;Initial Catalog=IdentityDb;User Id=sa;Password=IdentityDB*1;TrustServerCertificate=True;
    depends_on:
      - identity_db

  reviewing-api:
    image: reviewing-api:latest
    build:
      context: .
      dockerfile: Services/Review/Reviewing.Api/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_URLS=http://+:8082
      - ASPNETCORE_HTTP_PORTS=8082
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ReviewingDB=Host=reviewing-db;Database=reviewing;Username=postgres;Password=postgres;SSL Mode=Disable
    depends_on:
      reviewing-db:
        condition: service_healthy
    restart: on-failure

  notifications-api:
    image: notifications-api:latest
    build:
      context: .
      dockerfile: Services/Notifications/src/Notifications.API/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - ASPNETCORE_URLS=http://+:8083
      - ASPNETCORE_HTTP_PORTS=8083
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDb__ConnectionString=mongodb://root:notificationspwd@notifications-mongo:27017/?authSource=admin
      - MongoDb__Database=notifications
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    depends_on:
      notifications-mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  notifications-mongo:
    image: mongo:7
    container_name: notifications-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "notificationspwd"
      MONGO_INITDB_DATABASE: notifications
    ports:
      - "27018:27017"
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - notifications_mongo_data:/data/db

  tours_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tours_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PlaninarskeTureToursDB*1"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - tours_db_data:/var/opt/mssql

  identity_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: identity_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "IdentityDB*1"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - identity_db_data:/var/opt/mssql

  reviewing-db:
    image: postgres:16
    container_name: reviewing-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reviewing
    ports:
      - "6543:5432"
    volumes:
      - reviewing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  rabbitmq_data:
  notifications_mongo_data:
  tours_db_data:
  identity_db_data:
  reviewing_db_data:
  gateway_keys: